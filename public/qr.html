<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WACMS · WhatsApp connection</title><link rel="stylesheet" href="/app.css"><style>body{display:grid;place-items:center;min-height:100vh}.qr-wrap{width:min(440px,calc(100% - 32px));text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px}.qr-wrap a{color:#a492ff;text-decoration:none;display:block;text-align:left;margin-bottom:25px}.qr-wrap h1{font-size:25px}.qr-box{min-height:330px;display:grid;place-items:center;background:#fff;border-radius:12px;margin:22px 0;padding:12px}.qr-box img{width:320px;max-width:100%;display:none}.qr-box img.ready{display:block}.qr-box .placeholder{color:#707381;background:#151720;width:100%;height:300px;display:grid;place-items:center;border-radius:7px}.status{color:var(--muted);font-size:13px;margin:12px}.danger{background:transparent;border:1px solid #66313d;color:var(--red);border-radius:8px;padding:11px 15px;cursor:pointer}</style></head><body><main class="qr-wrap"><a href="/">← Back to dashboard</a><p class="eyebrow">WHATSAPP CONNECTION</p><h1>Connect your account</h1><p class="muted">Scan this QR code from WhatsApp on your phone to connect WACMS.</p><div class="qr-box"><div class="placeholder" id="placeholder">Waiting for QR code…</div><img id="qr" alt="WhatsApp login QR code"></div><div class="status" id="status">Checking connection…</div><button class="danger" id="clear">Clear session</button></main><script>const status=document.getElementById('status'),qr=document.getElementById('qr'),placeholder=document.getElementById('placeholder');async function tick(){try{const s=await fetch('/api/wa/status').then(r=>r.json());status.textContent=s.status.replaceAll('_',' ');if(s.connected){qr.classList.remove('ready');placeholder.textContent='WhatsApp connected ✓';placeholder.style.color='var(--green)'}else{const r=await fetch('/api/wa/qr.png?t='+Date.now());if(r.ok){qr.src=URL.createObjectURL(await r.blob());qr.classList.add('ready');placeholder.style.display='none'}}}catch(e){status.textContent='Connection status unavailable'}}document.getElementById('clear').onclick=async()=>{if(!confirm('Clear the saved WhatsApp session and generate a new QR?'))return;await fetch('/api/wa/clear-session',{method:'POST'});tick()};tick();setInterval(tick,3000)</script></body></html>
